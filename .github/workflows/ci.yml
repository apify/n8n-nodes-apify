name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.4, 24.22.1, 26.12.1]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js & cache npm
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Node 22 ships npm 10, below the npm engine floor that engine-strict enforces.
      - name: Upgrade npm
        if: startsWith(matrix.node-version, '22.')
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test
